<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Weather Widget -->
    <div id="weather-widget" class="weather-widget">
        <div id="weather-location" class="weather-location">25 Crouse Rd, Scarborough</div>
        <div class="weather-main">
            <span id="weather-icon" class="weather-icon">⏳</span>
            <span id="weather-temp">--°C</span>
        </div>
        <div id="weather-desc" class="weather-desc">Loading weather...</div>
        <div class="weather-details">
            <div>Feels like: <span id="w-feels-like">--</span></div>
            <div>Dew point: <span id="w-dew-point">--</span></div>
            <div>Visibility: <span id="w-visibility">--</span></div>
        </div>
    </div>

    <!-- Centered Google Search -->
    <div class="search-container">
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" class="google-logo">
        <form action="https://www.google.com/search" method="GET" class="search-form">
            <div class="search-box">
                <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                <input type="text" name="q" class="search-input" autofocus autocomplete="off">
                <svg class="mic-icon" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path><path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path><path fill="#fbbc05" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45.56 2.42 1.47 3.38v.32l-1.15 1.18z"></path><path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"></path></svg>
                <svg class="lens-icon" focusable="false" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg"><rect fill="none" height="192" width="192"></rect><g><circle fill="#34a853" cx="144.07" cy="144" r="16"></circle><circle fill="#4285f4" cx="96.07" cy="104" r="24"></circle><path fill="#ea4335" d="M24,135.2c0,18.11,14.69,32.8,32.8,32.8H96v-16H56.8c-9.28,0-16.8-7.52-16.8-16.8v-43.2H24V135.2z"></path><path fill="#fbbc05" d="M168,73.6V56.8C168,38.69,153.31,24,135.2,24H96v16h39.2c9.28,0,16.8,7.52,16.8,16.8v43.2H168V73.6z"></path><path fill="#4285f4" d="M56.8,24H96v16H56.8c-9.28,0-16.8,7.52-16.8,16.8v43.2H24V56.8C24,38.69,38.69,24,56.8,24z"></path></g></svg>
            </div>
        </form>
    </div>

    <script src="./script.js"></script>
</body>
</html>
